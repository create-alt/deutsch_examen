<style>

  .empty { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--sub); }
  .tips { background:#fffaf0; border:1px solid #f0e2c0; border-radius:10px; padding:12px 16px; font-size:.92rem; margin-bottom:8px; }

      { group: "CD 31 Ⅲ",
        prompt: "Wann und wo sind Sie geboren? — Ich bin 1985 in Bonn geboren.",

      { group: "CD 31 Ⅲ",
        prompt: "Heute wird der Geburtstag meines Großvaters gefeiert. Er wird 80 Jahre alt.",

          <li>BRD = ドイツ連邦共和国(西ドイツ)、DDR = ドイツ民主共和国(東ドイツ)。</li></ul>` },

      { group: "CD 33 Ⅱ",
        prompt: "Ich danke Ihnen für Ihren Gruß aus Italien. Ich habe mich über die schöne Karte sehr gefreut.",

      { group: "CD 33 Ⅱ",
        prompt: "Beeilen Sie sich! Der Zug fährt in 3 Minuten ab.",

        explain: `<ul><li><b>sich beeilen</b>(再帰動詞)=「急ぐ」。Sie への命令形は 動詞 + Sie + sich。</li>

      { group: "CD 33 Ⅱ",

      { group: "CD 33 Ⅱ",
        prompt: "Meine Mutter hat am 3. August Geburtstag.",

      { group: "CD 35 Ⅲ",

          <li>hoch schätzen =「高く評価する」。</li>

      { group: "CD 35 Ⅲ",

          <li>「この犬は〜」は関係代名詞 <b>der</b>(男性1格、先行詞 einen Hund)でつなぐ。mein guter Freund は1格。</li></ul>` }

/* ===================== アプリ本体 ===================== */
const state = {};   // state[sectionId][i] = true(正解) / false(不正解)
let current = location.hash.slice(1) || "passive";
if (!SECTIONS.some(s => s.id === current)) current = SECTIONS[0].id;

const norm = s => s.normalize("NFC").toLowerCase()
  .replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü").replace(/ss/g,"ß")
  .replace(/[.,!?;:。、—–„“"'’-]/g," ").replace(/\s+/g," ").trim();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const b = document.createElement("button");
    b.innerHTML = `${esc(s.title)}<span class="count">${s.questions.length}問</span>`;
    if (s.id === current) b.className = "active";
    b.onclick = () => { current = s.id; location.hash = s.id; render(); };
    nav.appendChild(b);
  });
}

function renderScore(sec) {
  const r = state[sec.id] || {};
  const done = Object.keys(r).length, ok = Object.values(r).filter(Boolean).length;
  const el = document.getElementById("score");
  if (el) el.textContent = sec.questions.length ? `正解 ${ok} / ${sec.questions.length}(回答済 ${done})` : "";
}

function render() {
  renderNav();
  const sec = SECTIONS.find(s => s.id === current);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="section-head"><h2>${esc(sec.title)}</h2><p>${esc(sec.instruction)}</p></div>
    ${sec.tips ? `<details class="tips"><summary>要点まとめ</summary>${sec.tips}</details>` : ""}
    ${sec.questions.length ? `<div class="toolbar">
        <button id="showAll">すべての解答を表示</button>
        <button id="reset">リセット</button>
        <span class="score" id="score"></span></div>` : ""}
    <div id="qs"></div>`;
  const qs = document.getElementById("qs");
  if (!sec.questions.length) {
    qs.innerHTML = `<div class="empty">このセクションの問題はまだ登録されていません。</div>`;
    return;
  }
  let lastGroup = null;
  sec.questions.forEach((q, i) => {
    if (q.group && q.group !== lastGroup) {
      const h = document.createElement("div");
      h.className = "group"; h.textContent = q.group;
      qs.appendChild(h); lastGroup = q.group;
    }
    qs.appendChild(renderQuestion(sec, q, i));
  });
  document.getElementById("showAll").onclick = () => qs.querySelectorAll(".answer").forEach(a => a.classList.add("open"));
  document.getElementById("reset").onclick = () => { state[sec.id] = {}; render(); };
  renderScore(sec);
}

function renderQuestion(sec, q, i) {
  const tr = sec.mode === "translate";
  const d = document.createElement("div");
  d.className = "q";
  d.innerHTML = `
    <div class="num">問 ${i + 1}</div>
    <div class="prompt">${esc(q.prompt)}</div>
    ${q.note ? `<div class="num">${esc(q.note)}</div>` : ""}
    <textarea rows="2" placeholder="${tr ? "→ 日本語訳を書いてみよう" : "→ ここに解答を入力"}" spellcheck="false" autocapitalize="off"></textarea>
    ${tr ? "" : `<div class="chars">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(c => `<button type="button">${c}</button>`).join("")}</div>`}
    <div class="actions">
      ${tr ? `<button class="btn-check">訳例と比べる</button>` : `<button class="btn-check">答え合わせ</button>`}
      <button class="btn-show">解答・解説を見る</button>
    </div>
    <div class="result"></div>
    <div class="answer">
      <div class="model${tr ? " ja-model" : ""}">${tr ? "訳例: " : ""}${esc(q.answers[0])}</div>
      ${q.answers.length > 1 ? `<div class="alt">別解: ${q.answers.slice(1).map(esc).join(" / ")}</div>` : ""}
      ${q.ja ? `<div class="ja">訳: ${esc(q.ja)}</div>` : ""}
      ${q.explain ? `<div class="exp">${q.explain}</div>` : ""}
    </div>`;
  const ta = d.querySelector("textarea"), res = d.querySelector(".result"), ans = d.querySelector(".answer");
  d.querySelectorAll(".chars button").forEach(b => b.onclick = () => {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + b.textContent + ta.value.slice(e);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + 1;
  });
  const mark = ok => {
    (state[sec.id] ||= {})[i] = ok;
    res.className = "result " + (ok ? "ok" : "ng");
    res.innerHTML = ok ? "◎ 正解!" :
      `× 模範解答と一致しませんでした。<div class="self">表現の違いだけなら <button>正解にする</button></div>`;
    if (!ok) res.querySelector("button").onclick = () => mark(true);
    ans.classList.add("open");
    renderScore(sec);
  };
  d.querySelector(".btn-check").onclick = tr ? () => {
    ans.classList.add("open");
    res.className = "result";
    res.innerHTML = `<div class="self">意味が合っていたら → <button data-v="1">○ できた</button> <button data-v="0">× まだ</button></div>`;
    res.querySelectorAll("button").forEach(b => b.onclick = () => {
      (state[sec.id] ||= {})[i] = b.dataset.v === "1";
      res.className = "result " + (b.dataset.v === "1" ? "ok" : "ng");
      res.textContent = b.dataset.v === "1" ? "○ できた" : "× もう一度復習";
      renderScore(sec);
    });
  } : () => {
    if (!ta.value.trim()) { res.className = "result ng"; res.textContent = "解答を入力してください。"; return; }
    mark(q.answers.some(a => norm(a) === norm(ta.value)));
  };
  d.querySelector(".btn-show").onclick = () => ans.classList.toggle("open");
  return d;
}

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (SECTIONS.some(s => s.id === h) && h !== current) { current = h; render(); }
});
render();
</script>
