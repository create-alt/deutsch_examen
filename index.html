<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドイツ語 後期中間試験対策</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --sub:#5b6475; --line:#dde1e8; --accent:#2f5bd3; --ok:#1f8a4c; --ng:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 20px; position:sticky; top:0; z-index:10; }
  header h1 { margin:0; font-size:1.15rem; }
  nav { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  nav button { flex:none; border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:.9rem; color:var(--ink); }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  nav button .count { opacity:.7; font-size:.8em; margin-left:4px; }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .section-head { margin-bottom:16px; }
  .section-head h2 { margin:0 0 4px; font-size:1.1rem; }
  .section-head p { margin:0; color:var(--sub); font-size:.92rem; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; align-items:center; }
  .toolbar button { border:1px solid var(--line); background:var(--card); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:.88rem; }
  .score { margin-left:auto; font-weight:600; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin:12px 0; }
  .q .num { color:var(--sub); font-size:.85rem; }
  .q .prompt { font-size:1.15rem; margin:4px 0 10px; font-family: Georgia, "Times New Roman", serif; }
  .q textarea { width:100%; font-size:1.05rem; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family: Georgia, "Times New Roman", serif; resize:vertical; min-height:2.6em; }
  .chars { display:flex; gap:6px; margin:6px 0; }
  .chars button { border:1px solid var(--line); background:#fafbfc; border-radius:4px; width:34px; height:30px; cursor:pointer; font-size:1rem; }
  .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .actions button { border:none; border-radius:6px; padding:7px 14px; cursor:pointer; font-size:.92rem; }
  .btn-check { background:var(--accent); color:#fff; }
  .btn-show { background:#e8ecf5; color:var(--ink); }
  .result { margin-top:10px; font-weight:600; }
  .result.ok { color:var(--ok); } .result.ng { color:var(--ng); }
  .answer { margin-top:10px; padding:12px; background:#f3f6fd; border-radius:8px; display:none; }
  .answer.open { display:block; }
  .answer .model { font-family: Georgia, "Times New Roman", serif; font-size:1.08rem; font-weight:600; }
  .answer .alt { color:var(--sub); font-size:.9rem; margin-top:4px; }
  .answer .ja { margin-top:4px; }
  .answer .exp { margin-top:8px; font-size:.93rem; }
  .answer .exp ul { margin:4px 0; padding-left:1.2em; }
  .self { margin-top:6px; font-size:.85rem; }
  .self button { border:1px solid var(--line); background:var(--card); border-radius:4px; padding:2px 8px; cursor:pointer; font-size:.85rem; }
  .group { margin:22px 0 4px; font-size:.85rem; font-weight:700; color:var(--accent); letter-spacing:.05em; }
  .answer .ja-model { font-family:inherit; font-weight:600; font-size:1rem; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
  .choice { border:1px solid var(--line); background:#fafbfc; border-radius:8px; padding:8px 14px; cursor:pointer; font-size:1.1rem; font-family: Georgia, "Times New Roman", serif; color:var(--ink); }
  .choice.picked-ok { background:#e6f5ec; border-color:var(--ok); }
  .choice.picked-ng { background:#fbeaea; border-color:var(--ng); }
  em.hl { font-style:italic; text-decoration:underline; text-underline-offset:3px; font-weight:700; }
  .choice.sel { background:#e8eefc; border-color:var(--accent); }
  .choice.missed { border:2px dashed var(--ok); }
  .items { display:flex; flex-direction:column; gap:6px; margin:6px 0; }
  .item { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .iw { min-width:7em; font-family: Georgia, "Times New Roman", serif; font-size:1.08rem; }
  .opt { border:1px solid var(--line); background:#fafbfc; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.95rem; font-family: Georgia, "Hiragino Sans", serif; color:var(--ink); }
  .opt.sel { background:#e8eefc; border-color:var(--accent); }
  .imark { font-weight:700; font-size:.9rem; }
  .imark.ok { color:var(--ok); } .imark.ng { color:var(--ng); }
  .cw { display:inline-flex; align-items:center; gap:2px; }
  .spk { border:none; background:none; cursor:pointer; font-size:1rem; padding:2px 4px; border-radius:4px; opacity:.75; }
  .spk:hover { background:#eef1f7; opacity:1; }
  .ttsbar { font-size:.88rem; color:var(--sub); margin:0 0 10px; }
  .ttsbar select { font-size:.85rem; margin-left:4px; }
  .ttswarn { margin-top:6px; padding:8px 10px; background:#fff4e5; border:1px solid #f3d19c; border-radius:6px; color:#7a4a00; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--sub); }
  .tips { background:#fffaf0; border:1px solid #f0e2c0; border-radius:10px; padding:12px 16px; font-size:.92rem; margin-bottom:8px; }
  .tips summary { cursor:pointer; font-weight:600; }
  .tips table { border-collapse:collapse; margin:6px 0; }
  .tips td, .tips th { border:1px solid #eadfc4; padding:3px 8px; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>ドイツ語 後期中間試験対策</h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
/* =====================================================================
   問題データ
   ---------------------------------------------------------------------
   セクションごとに questions 配列へ問題を追加するだけで画面に反映されます。
   各問題のフィールド:
     prompt   : 問題文(写真どおり)
     answers  : 正解として受け付ける解答(1つ目が模範解答)
     ja       : 和訳(任意)
     explain  : 解説(HTML可、任意)
   ===================================================================== */
const SECTIONS = [
  {
    id: "pronunciation",
    title: "1. 発音",
    instruction: "次の各組の単語の中に、斜体の部分の発音が他と異なる語が1語ずつあります。その単語を選びなさい。(2点×10)",
    mode: "choice",
    // choices の [ ] で囲んだ部分が問題用紙の斜体部分(画面では下線つき斜体で表示)
    // answer は正解の番号(1〜4)
    // 補足問題は group: "補足問題" をつけて questions の末尾に追加する
    supplementGroup: "補足問題",
    tips: `
      <table>
        <tr><th>つづり</th><th>発音</th><th>例</th></tr>
        <tr><td>ch(a, o, u, au の後)</td><td>[x] 喉の奥の「ハ」</td><td>Sprache, Buch, auch</td></tr>
        <tr><td>ch(それ以外:e, i, ä, ö, ü, 子音の後)</td><td>[ç]「ヒ」</td><td>ich, möchte, durch, nächst</td></tr>
        <tr><td>chs / x</td><td>[ks]</td><td>sechs, wachsen, Taxi</td></tr>
        <tr><td>z / tz / ts</td><td>[ts]</td><td>Zimmer, jetzt, Herz</td></tr>
        <tr><td>w / qu</td><td>[v] / [kv]</td><td>Mittwoch, bequem</td></tr>
        <tr><td>v</td><td>ふつう [f]、外来語は [v]</td><td>viel [f] / November [v]</td></tr>
        <tr><td>語頭・つづりの頭の st, sp</td><td>[ʃt] [ʃp]</td><td>Stern, be|stehen, Spaß</td></tr>
        <tr><td>それ以外の st</td><td>[st]</td><td>gestern, Fenster</td></tr>
        <tr><td>s + 母音</td><td>[z](濁る)</td><td>sagen, unser, Pause</td></tr>
        <tr><td>語末・音節末の s</td><td>[s]</td><td>Samstag, eins</td></tr>
        <tr><td>語末・音節末の b, d, g</td><td>[p] [t] [k]</td><td>Rundfunk, Tag</td></tr>
        <tr><td>ie</td><td>[iː]、アクセントのない語末の -ie は [iə]</td><td>Liebe / Familie</td></tr>
        <tr><td>ei / ai</td><td>[aɪ]「アイ」</td><td>eins, Mai</td></tr>
        <tr><td>eu / äu</td><td>[ɔʏ]「オイ」</td><td>heute, Fräulein</td></tr>
      </table>`,
    questions: [
      { group: "大問1", choices: ["dur[ch]", "Spra[ch]e", "wi[ch]tig", "mö[ch]te"], answer: 2,
        readings: ["[ç]", "[x]", "[ç]", "[ç]"],
        explain: "a, o, u, au の後の ch は [x](喉の奥の「ハ」)。それ以外の ch は [ç](「ヒ」)。durch は子音 r の後なので [ç]。" },
      { group: "大問1", choices: ["[Z]immer", "je[tz]t", "Her[z]", "[T]ier"], answer: 4,
        readings: ["[ts]", "[ts]", "[ts]", "[t]"],
        explain: "z と tz はどちらも [ts](「ツ」)。Tier の T だけが [t]。" },
      { group: "大問1", choices: ["Mitt[w]och", "beq[u]em", "No[v]ember", "[v]iel"], answer: 4,
        readings: ["[v]", "[v](qu = [kv])", "[v]", "[f]"],
        explain: "w は [v]。qu は [kv] なので u の部分が [v]。v はふつう [f] だが、November のような外来語では [v]。viel の v は [f]。" },
      { group: "大問1", choices: ["[S]tern", "ge[s]tern", "be[s]tehen", "[S]paß"], answer: 2,
        readings: ["[ʃ]", "[s]", "[ʃ]", "[ʃ]"],
        explain: "語頭(つづりの頭)の st, sp の s は [ʃ](「シュ」)。bestehen は be + stehen なので stehen の頭として [ʃt]。gestern の st は語中なので [st]。" },
      { group: "大問1", choices: ["L[ie]be", "B[i]bel", "B[ie]ne", "Famil[ie]"], answer: 4,
        readings: ["[iː]", "[iː]", "[iː]", "[iə]"],
        explain: "ie はふつう長い [iː]。Bibel の i もアクセントがあり長い [iː]。Familie のようにアクセントのない語末の -ie は [iə](「イエ」)。" },
      { group: "大問1", choices: ["Run[d]funk", "[d]raußen", "Frie[d]e", "[D]ruck"], answer: 1,
        readings: ["[t]", "[d]", "[d]", "[d]"],
        explain: "語末・音節末の d は [t] になる(Rund|funk の d は Rund の終わり)。ほかは母音や r の前なので [d]。" },
      { group: "大問1", choices: ["[ei]ns", "Fräul[ei]n", "M[ai]", "L[ie]d"], answer: 4,
        readings: ["[aɪ]", "[aɪ]", "[aɪ]", "[iː]"],
        explain: "ei と ai は [aɪ](「アイ」)。ie は [iː](「イー」)。" },
      { group: "大問1", choices: ["[s]agen", "un[s]er", "Pau[s]e", "Sam[s]tag"], answer: 4,
        readings: ["[z]", "[z]", "[z]", "[s]"],
        explain: "母音の前の s は濁って [z]。Samstag の s は Sams|tag の音節末で、後ろに母音がないので濁らず [s]。" },
      { group: "大問1", choices: ["h[eu]te", "Mus[eu]m", "Fr[eu]de", "L[eu]te"], answer: 2,
        readings: ["[ɔʏ]", "[eːʊ]", "[ɔʏ]", "[ɔʏ]"],
        explain: "eu はふつう [ɔʏ](「オイ」)。Museum は外来語で Mu-se-um と e と u が別々の音節なので「エーウ」。" },
      { group: "大問1", choices: ["se[chs]", "Ta[x]i", "nä[ch]st", "wa[chs]en"], answer: 3,
        readings: ["[ks]", "[ks]", "[ç]", "[ks]"],
        explain: "chs と x は [ks](「クス」)。nächst の ch は chs ではなく ch + st なので、ä の後の [ç]。" },
      // ================= 補足問題 =================
      // type: 省略=1つ選ぶ / "multi"=当てはまるものを全部選ぶ / "items"=語ごとに選ぶ(長短・分類・アクセント)
      // ---- プリント1 ----
      { group: "補足問題 プリント1-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["dur[ch]", "Spra[ch]e", "wi[ch]tig", "mö[ch]te"], answer: 2,
        readings: ["[ç]", "[x]", "[ç]", "[ç]"],
        explain: "a, o, u, au の後の ch は [x]、それ以外(子音 r の後も含む)は [ç]。" },
      { group: "補足問題 プリント1-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["ho[ch]", "Ku[ch]en", "au[ch]", "Re[ch]t"], answer: 4,
        readings: ["[x]", "[x]", "[x]", "[ç]"],
        explain: "o, u, au の後なので hoch, Kuchen, auch は [x]。Recht は e の後なので [ç]。" },
      { group: "補足問題 プリント1-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["se[chs]", "Ta[x]i", "nä[ch]st", "wa[chs]en"], answer: 3,
        readings: ["[ks]", "[ks]", "[ç]", "[ks]"],
        explain: "chs と x は [ks]。nächst は ch + st なので ä の後の [ç]。" },
      { group: "補足問題 プリント1-B:斜体の母音は長音か短音か", type: "items",
        items: [
          { w: "T[o]chter", opts: ["長", "短"], a: 2 }, { w: "B[u]ch", opts: ["長", "短"], a: 1 },
          { w: "N[a]cht", opts: ["長", "短"], a: 2 }, { w: "h[o]ch", opts: ["長", "短"], a: 1 },
          { w: "Z[u]cker", opts: ["長", "短"], a: 2 }, { w: "K[o]pf", opts: ["長", "短"], a: 2 },
          { w: "Pf[e]rd", opts: ["長", "短"], a: 1 }, { w: "d[o]ch", opts: ["長", "短"], a: 2 } ],
        explain: `<ul><li>原則:母音の後の子音が<b>1つなら長く</b>、<b>2つ以上なら短く</b>読む(Tochter, Nacht, Zucker, Kopf, doch)。</li>
          <li>ch は2文字でも1つの子音扱いなので Buch, hoch は長い。doch は例外的に短い。</li>
          <li>Pferd は rd と子音が2つだが例外で長い [eː]。</li></ul>` },
      { group: "補足問題 プリント1-C:[ ]の発音を含む語をすべて選ぶ", type: "multi", labels: "iroha",
        prompt: "[k]", choices: ["Onkel", "Junge", "Ecke", "Chrom", "Tag", "Chance"], answer: [1, 3, 4, 5],
        readings: ["[k]", "[ŋ](ng)", "[k](ck)", "[k](Chr-)", "[k](語末の g)", "[ʃ](フランス語由来)"],
        explain: "語末の g は [k] になる(Tag)。Ch は外来語で [k](Chrom)や [ʃ](Chance)になる。ng は [ŋ] で k の音は含まない。" },
      { group: "補足問題 プリント1-C:[ ]の発音を含む語をすべて選ぶ", type: "multi", labels: "iroha",
        prompt: "[ç]", choices: ["ich", "China", "König", "acht", "euch", "Chor"], answer: [1, 2, 3, 5],
        readings: ["[ç]", "[ç]", "[ç](語末の -ig)", "[x]", "[ç]", "[k]"],
        explain: "語末の -ig は [ɪç](König)。euch は eu の後で [ç](au の後とちがうので注意)。acht は a の後で [x]。Chor は [k]。" },
      { group: "補足問題 プリント1-C:[ ]の発音を含む語をすべて選ぶ", type: "multi", labels: "iroha",
        prompt: "[x]", choices: ["Echo", "rauchen", "Bach", "kochen", "wachsen", "Tuch"], answer: [2, 3, 4, 6],
        readings: ["[ç]", "[x]", "[x]", "[x]", "[ks]", "[x]"],
        explain: "a, o, u, au の後の ch が [x]。Echo は e の後なので [ç]、wachsen は chs なので [ks]。" },
      { group: "補足問題 プリント1-C:[ ]の発音を含む語をすべて選ぶ", type: "multi", labels: "iroha",
        prompt: "[ʃ]", choices: ["Stimme", "Spaß", "Knospe", "Charme", "Kasten", "Schule"], answer: [1, 2, 4, 6],
        readings: ["[ʃt]", "[ʃp]", "[sp](語中)", "[ʃ](フランス語由来)", "[st]", "[ʃ](sch)"],
        explain: "語頭の st, sp と sch は [ʃ]。Charme はフランス語由来で ch = [ʃ]。語中の sp, st(Knospe, Kasten)は [s]。" },

      // ---- プリント2 ----
      { group: "補足問題 プリント2-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["[S]tern", "ge[s]tern", "be[s]tehen", "[S]paß"], answer: 2,
        readings: ["[ʃ]", "[s]", "[ʃ]", "[ʃ]"],
        explain: "語頭(つづりの頭)の st, sp は [ʃt] [ʃp]。bestehen = be + stehen。gestern は語中なので [st]。" },
      { group: "補足問題 プリント2-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["alle[s]", "gro[ß]", "Dien[s]tag", "[S]onntag"], answer: 4,
        readings: ["[s]", "[s]", "[s]", "[z]"],
        explain: "語末・音節末の s と ß は [s]。Sonntag の S は母音の前なので濁って [z]。" },
      { group: "補足問題 プリント2-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["drei[ß]ig", "Pla[tz]", "aben[ds]", "nich[ts]"], answer: 1,
        readings: ["[s]", "[ts]", "[ts]", "[ts]"],
        explain: "tz, ts, そして語末の ds(d が [t] になる)はすべて [ts]。ß は [s]。" },
      { group: "補足問題 プリント2-A:斜体の部分の発音が他と異なる語", labels: "iroha",
        choices: ["Mitt[w]och", "[v]iel", "No[v]ember", "beq[u]em"], answer: 2,
        readings: ["[v]", "[f]", "[v]", "[v]"],
        explain: "w は [v]、qu は [kv]。v はふつう [f](viel)だが、外来語の November は [v]。" },
      { group: "補足問題 プリント2-B:斜体の母音は長音か短音か", type: "items",
        items: [
          { w: "Str[a]ße", opts: ["長", "短"], a: 1 }, { w: "[e]ssen", opts: ["長", "短"], a: 2 },
          { w: "gr[o]ß", opts: ["長", "短"], a: 1 }, { w: "spr[e]chen", opts: ["長", "短"], a: 2 },
          { w: "Spr[a]che", opts: ["長", "短"], a: 1 }, { w: "F[u]ß", opts: ["長", "短"], a: 1 },
          { w: "Kl[o]ster", opts: ["長", "短"], a: 1 }, { w: "Fl[u]ß", opts: ["長", "短"], a: 2 } ],
        explain: `<ul><li><b>ß の前は長母音</b>(Straße, groß, Fuß)。ss の前は短母音(essen)。</li>
          <li>Fluß は旧つづりで、今は <b>Fluss</b>(短母音なので ss)と書く。</li>
          <li>Sprache は a の後の ch が1つの子音扱いなので長い。sprechen は短い。</li>
          <li>Kloster は st の前だが例外で長い。</li></ul>` },
      { group: "補足問題 プリント2-C:斜体の部分の発音で分類", type: "items",
        prompt: "それぞれの語の斜体部分の発音を選ぶ(各発音に2語ずつ)",
        items: [
          { w: "hei[ß]", a: 1 }, { w: "la[ch]en", a: 5 }, { w: "Ber[g]", a: 7 }, { w: "Deu[tsch]", a: 4 },
          { w: "[s]tark", a: 3 }, { w: "Scha[tz]", a: 2 }, { w: "[sch]on", a: 3 }, { w: "We[s]ten", a: 1 },
          { w: "Te[ch]nik", a: 6 }, { w: "ho[ch]", a: 5 }, { w: "[Tsch]eche", a: 4 }, { w: "Köni[g]", a: 6 },
          { w: "Rei[s]e", a: 8 }, { w: "[Z]immer", a: 2 }, { w: "[S]ohn", a: 8 }, { w: "[Ch]aos", a: 7 } ]
          .map(x => ({ ...x, opts: ["[s]", "[ts]", "[ʃ]", "[tʃ]", "[x]", "[ç]", "[k]", "[z]"] })),
        explain: `<ul><li>[s]: heiß, Westen ／ [ts]: Schatz, Zimmer ／ [ʃ]: stark, schon ／ [tʃ]: Deutsch, Tscheche</li>

/* ===================== アプリ本体 ===================== */
const state = {};   // state[sectionId][i] = true(正解) / false(不正解)
let current = location.hash.slice(1) || SECTIONS[0].id;
if (!SECTIONS.some(s => s.id === current)) current = SECTIONS[0].id;

const norm = s => s.normalize("NFC").toLowerCase()
  .replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü").replace(/ss/g,"ß")
  .replace(/[.,!?;:。、—–„“"'’-]/g," ").replace(/\s+/g," ").trim();
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  SECTIONS.forEach(s => {
    const b = document.createElement("button");
    b.innerHTML = `${esc(s.title)}<span class="count">${s.questions.length}問</span>`;
    if (s.id === current) b.className = "active";
    b.onclick = () => { current = s.id; location.hash = s.id; render(); };
    nav.appendChild(b);
  });
}

function renderScore(sec) {
  const r = state[sec.id] || {};
  const done = Object.keys(r).length, ok = Object.values(r).filter(Boolean).length;
  const el = document.getElementById("score");
  if (el) el.textContent = sec.questions.length ? `正解 ${ok} / ${sec.questions.length}(回答済 ${done})` : "";
}

function render() {
  renderNav();
  const sec = SECTIONS.find(s => s.id === current);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="section-head"><h2>${esc(sec.title)}</h2><p>${esc(sec.instruction)}</p></div>
    ${sec.mode === "choice" ? `<div class="ttsbar" id="ttsbar"></div>` : ""}
    ${sec.tips ? `<details class="tips"><summary>要点まとめ</summary>${sec.tips}</details>` : ""}
    ${sec.questions.length ? `<div class="toolbar">
        <button id="showAll">すべての解答を表示</button>
        <button id="reset">リセット</button>
        <span class="score" id="score"></span></div>` : ""}
    <div id="qs"></div>`;
  const qs = document.getElementById("qs");
  if (!sec.questions.length) {
    qs.innerHTML = `<div class="empty">このセクションの問題はまだ登録されていません。</div>`;
    return;
  }
  updateTtsBar();
  let lastGroup = null;
  sec.questions.forEach((q, i) => {
    if (q.group && q.group !== lastGroup) {
      const h = document.createElement("div");
      h.className = "group"; h.textContent = q.group;
      qs.appendChild(h); lastGroup = q.group;
    }
    qs.appendChild(sec.mode === "choice" ? renderChoice(sec, q, i) : renderQuestion(sec, q, i));
  });
  if (sec.supplementGroup && !sec.questions.some(q => (q.group || "").startsWith(sec.supplementGroup))) {
    qs.insertAdjacentHTML("beforeend", `<div class="group">${esc(sec.supplementGroup)}</div>
      <div class="empty">補足問題はまだ登録されていません。</div>`);
  }
  document.getElementById("showAll").onclick = () => qs.querySelectorAll(".answer").forEach(a => a.classList.add("open"));
  document.getElementById("reset").onclick = () => { state[sec.id] = {}; render(); };
  renderScore(sec);
}

// "dur[ch]" → dur<em>ch</em>(斜体部分に下線)
const hl = w => esc(w).replace(/\[(.+?)\]/g, '<em class="hl">$1</em>');
// "[k]" のように全体が [ ] の場合は発音記号としてそのまま表示
const hlo = t => /^\[[^\]]*\]$/.test(t) ? esc(t) : hl(t);
const NUM = ["①","②","③","④","⑤"];

/* ===== 読み上げ(ブラウザの音声合成 Web Speech API・ドイツ語) ===== */
const TTS = "speechSynthesis" in window;
const plain = t => t.replace(/[\[\]]/g, "");
const deVoice = () => TTS ? speechSynthesis.getVoices().find(v => /^de([-_]|$)/i.test(v.lang)) : null;
let ttsRate = 0.8;
function speak(text) {
  if (!TTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  const v = deVoice(); if (v) u.voice = v;
  u.rate = ttsRate;
  speechSynthesis.speak(u);
}
const spk = t => TTS ? `<button type="button" class="spk" data-say="${esc(plain(t))}" title="読み上げ" aria-label="${esc(plain(t))} を読み上げ">🔊</button>` : "";
function ttsNotice() {
  if (!TTS) return "このブラウザは読み上げ機能に対応していません。Chrome や Safari の最新版で開くと🔊ボタンで発音を聞けます。";
  if (speechSynthesis.getVoices().length && !deVoice())
    return "この端末にドイツ語の音声が見つからないため、別の言語の発音で読まれる可能性があります。iPhone は「設定 > アクセシビリティ > 読み上げコンテンツ > 声」、Android は「設定 > テキスト読み上げ」からドイツ語の音声を追加してください。";
  return "";
}
function updateTtsBar() {
  const el = document.getElementById("ttsbar"); if (!el) return;
  const msg = ttsNotice();
  el.innerHTML = `${TTS ? `🔊 単語の横のボタンで発音を聞けます。速さ:
    <select id="ttsRate"><option value="0.6">ゆっくり</option><option value="0.8">ふつう</option><option value="1">速め</option></select>` : ""}
    ${msg ? `<div class="ttswarn">${esc(msg)}</div>` : ""}`;
  const sel = document.getElementById("ttsRate");
  if (sel) { sel.value = String(ttsRate); sel.onchange = () => ttsRate = +sel.value; }
}
if (TTS) speechSynthesis.addEventListener("voiceschanged", updateTtsBar);
document.addEventListener("click", e => {
  const b = e.target.closest(".spk"); if (b) { e.stopPropagation(); speak(b.dataset.say); }
}, true);

const IROHA = ["イ","ロ","ハ","ニ","ホ","ヘ","ト","チ"];

// 選択式(1つ選ぶ / 複数選ぶ / 語ごとに選ぶ)
function renderChoice(sec, q, i) {
  const L = q.labels === "iroha" ? IROHA : NUM;
  const type = q.type || "single";
  const d = document.createElement("div");
  d.className = "q";
  const choicesHtml = type === "items"
    ? `<div class="items">${q.items.map((it, j) => `
        <div class="item" data-j="${j}"><span class="iw">${hl(it.w)}${spk(it.w)}</span>
          <span class="iopts">${it.opts.map((o, k) => `<button type="button" class="opt" data-k="${k + 1}">${hlo(o)}</button>`).join("")}</span>
          <span class="imark"></span></div>`).join("")}</div>`
    : `<div class="choices">${q.choices.map((c, k) =>
        `<span class="cw"><button type="button" class="choice" data-k="${k + 1}">${L[k]} ${hl(c)}</button>${spk(c)}</span>`).join("")}</div>`;
  const correctText = type === "items"
    ? q.items.map(it => `${hl(it.w)} → <b>${hlo(it.opts[it.a - 1])}</b>`).join(" ／ ")
    : [].concat(q.answer).map(a => `${L[a - 1]} ${hl(q.choices[a - 1])}`).join("、");
  d.innerHTML = `
    <div class="num">問 ${i + 1}${type === "multi" ? "(当てはまるものをすべて選ぶ)" : ""}</div>
    ${q.prompt ? `<div class="prompt">${/^\[[^\]]*\]$/.test(q.prompt) ? "発音 " + esc(q.prompt) : hl(q.prompt) + (q.prompt.includes("[") ? spk(q.prompt) : "")}</div>` : ""}
    ${choicesHtml}
    <div class="actions">
      ${type === "single" ? "" : `<button class="btn-check">答え合わせ</button>`}
      <button class="btn-show">解答・解説を見る</button>
    </div>
    <div class="result"></div>
    <div class="answer">
      <div class="model ja-model">正解: ${correctText}</div>
      ${q.readings ? `<div class="alt">${q.choices.map((c, k) => `${L[k]} ${hl(c)} ${esc(q.readings[k])}`).join(" / ")}</div>` : ""}
      ${q.explain ? `<div class="exp">${q.explain}</div>` : ""}
    </div>`;
  const res = d.querySelector(".result"), ans = d.querySelector(".answer");
  const finish = ok => {
    (state[sec.id] ||= {})[i] = ok;
    res.className = "result " + (ok ? "ok" : "ng");
    res.textContent = ok ? "◎ 正解!" : "× 解答・解説を確認しよう。";
    ans.classList.add("open");
    renderScore(sec);
  };
  if (type === "single") {
    d.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      const ok = +b.dataset.k === q.answer;
      d.querySelectorAll(".choice").forEach(x => x.classList.remove("picked-ok", "picked-ng"));
      b.classList.add(ok ? "picked-ok" : "picked-ng");
      finish(ok);
      if (!ok) res.textContent = `× 正解は ${L[q.answer - 1]} です。`;
    });
  } else if (type === "multi") {
    d.querySelectorAll(".choice").forEach(b => b.onclick = () => b.classList.toggle("sel"));
    d.querySelector(".btn-check").onclick = () => {
      const want = new Set(q.answer); let ok = true;
      d.querySelectorAll(".choice").forEach(b => {
        const k = +b.dataset.k, sel = b.classList.contains("sel");
        b.classList.remove("picked-ok", "picked-ng", "missed");
        if (sel && want.has(k)) b.classList.add("picked-ok");
        else if (sel) { b.classList.add("picked-ng"); ok = false; }
        else if (want.has(k)) { b.classList.add("missed"); ok = false; }
      });
      finish(ok);
    };
  } else {
    d.querySelectorAll(".item").forEach(row => row.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      row.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
    }));
    d.querySelector(".btn-check").onclick = () => {
      let ok = true;
      d.querySelectorAll(".item").forEach(row => {
        const it = q.items[+row.dataset.j], sel = row.querySelector(".opt.sel");
        const good = sel && +sel.dataset.k === it.a;
        if (!good) ok = false;
        const m = row.querySelector(".imark");
        m.className = "imark " + (good ? "ok" : "ng");
        m.innerHTML = good ? "○" : `× → ${hlo(it.opts[it.a - 1])}`;
      });
      finish(ok);
    };
  }
  d.querySelector(".btn-show").onclick = () => ans.classList.toggle("open");
  return d;
}

function renderQuestion(sec, q, i) {
  const tr = sec.mode === "translate";
  const d = document.createElement("div");
  d.className = "q";
  d.innerHTML = `
    <div class="num">問 ${i + 1}</div>
    <div class="prompt">${esc(q.prompt)}</div>
    ${q.note ? `<div class="num">${esc(q.note)}</div>` : ""}
    <textarea rows="2" placeholder="${tr ? "→ 日本語訳を書いてみよう" : "→ ここに解答を入力"}" spellcheck="false" autocapitalize="off"></textarea>
    ${tr ? "" : `<div class="chars">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(c => `<button type="button">${c}</button>`).join("")}</div>`}
    <div class="actions">
      ${tr ? `<button class="btn-check">訳例と比べる</button>` : `<button class="btn-check">答え合わせ</button>`}
      <button class="btn-show">解答・解説を見る</button>
    </div>
    <div class="result"></div>
    <div class="answer">
      <div class="model${tr ? " ja-model" : ""}">${tr ? "訳例: " : ""}${esc(q.answers[0])}</div>
      ${q.answers.length > 1 ? `<div class="alt">別解: ${q.answers.slice(1).map(esc).join(" / ")}</div>` : ""}
      ${q.ja ? `<div class="ja">訳: ${esc(q.ja)}</div>` : ""}
      ${q.explain ? `<div class="exp">${q.explain}</div>` : ""}
    </div>`;
  const ta = d.querySelector("textarea"), res = d.querySelector(".result"), ans = d.querySelector(".answer");
  d.querySelectorAll(".chars button").forEach(b => b.onclick = () => {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + b.textContent + ta.value.slice(e);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + 1;
  });
  const mark = ok => {
    (state[sec.id] ||= {})[i] = ok;
    res.className = "result " + (ok ? "ok" : "ng");
    res.innerHTML = ok ? "◎ 正解!" :
      `× 模範解答と一致しませんでした。<div class="self">表現の違いだけなら <button>正解にする</button></div>`;
    if (!ok) res.querySelector("button").onclick = () => mark(true);
    ans.classList.add("open");
    renderScore(sec);
  };
  d.querySelector(".btn-check").onclick = tr ? () => {
    ans.classList.add("open");
    res.className = "result";
    res.innerHTML = `<div class="self">意味が合っていたら → <button data-v="1">○ できた</button> <button data-v="0">× まだ</button></div>`;
    res.querySelectorAll("button").forEach(b => b.onclick = () => {
      (state[sec.id] ||= {})[i] = b.dataset.v === "1";
      res.className = "result " + (b.dataset.v === "1" ? "ok" : "ng");
      res.textContent = b.dataset.v === "1" ? "○ できた" : "× もう一度復習";
      renderScore(sec);
    });
  } : () => {
    if (!ta.value.trim()) { res.className = "result ng"; res.textContent = "解答を入力してください。"; return; }
    mark(q.answers.some(a => norm(a) === norm(ta.value)));
  };
  d.querySelector(".btn-show").onclick = () => ans.classList.toggle("open");
  return d;
}

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (SECTIONS.some(s => s.id === h) && h !== current) { current = h; render(); }
});
render();
</script>
